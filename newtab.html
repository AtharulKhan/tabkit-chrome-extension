<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<script src="redirect.js"></script>
<style>html:not(.tk-launcher) body { visibility: hidden; }</style>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;
    background:
      linear-gradient(rgba(250, 249, 245, 0.55), rgba(250, 249, 245, 0.72)),
      url("assets/wallpaper.jpg") center / cover fixed no-repeat,
      var(--bg);
  }
  .wrap { width: min(680px, 92vw); text-align: center; }
  #clock { font-size: 84px; font-weight: 700; letter-spacing: -0.02em; }
  #date { color: var(--muted); margin-bottom: 30px; }
  form { margin-bottom: 34px; }
  form input {
    padding: 15px 20px; border-radius: 999px; font-size: 16px; text-align: left;
    background: rgba(255, 255, 255, 0.85); box-shadow: 0 8px 26px rgba(36,35,31,.08);
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; text-align: left; }
  #results { text-align: left; margin: -18px 0 30px; display: none; }
  #results .group { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 4px 5px; font-weight: 650; }
  #results .hit { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  #results .hit:hover { background: rgba(255, 255, 255, 0.75); }
  #results .hit img { width: 16px; height: 16px; border-radius: 4px; background: #f0eee6; padding: 1px; flex: none; }
  #results .hit .t { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results .hit .u { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile { cursor: pointer; transition: .15s; }
  .tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tile h3 { font-size: 15px; margin-bottom: 4px; }
  .tile .favicons { display: flex; gap: 4px; margin: 10px 0 6px; flex-wrap: wrap; }
  .tile .favicons img { width: 18px; height: 18px; border-radius: 5px; background: #f0eee6; padding: 1px; }
  #saved { position: fixed; bottom: 18px; right: 18px; }
  .section-head { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
  .section-head button { margin-left: auto; }
  .qt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; text-align: center; }
  .qt { position: relative; padding: 12px 6px 10px; cursor: pointer; transition: .15s; }
  .qt:hover { border-color: var(--accent); transform: translateY(-2px); }
  .qt img { width: 26px; height: 26px; border-radius: 7px; background: #f0eee6; padding: 2px; }
  .qt .qt-name { font-size: 12.5px; font-weight: 550; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qt .qt-x { position: absolute; top: 4px; right: 6px; border: none; background: none; color: var(--muted); font-size: 14px; padding: 2px 5px; box-shadow: none; display: none; }
  .qt:hover .qt-x { display: block; }
  .qt-add { display: grid; place-items: center; color: var(--muted); font-size: 22px; min-height: 86px; cursor: pointer; border-style: dashed; }
  #qt-form { text-align: left; margin-top: 10px; display: none; }
  #qt-form .row { margin-top: 8px; }
  #qt-form input { flex: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <form id="search-form">
      <input type="text" id="search" placeholder="Search tabs, bookmarks, history, or the web" autocomplete="off" autofocus>
    </form>
    <div id="results" class="card"></div>
    <div id="quick-area"></div>
    <div class="section-head" id="sets-head" hidden>Tab sets</div>
    <div class="tiles" id="tiles"></div>
  </div>
  <span class="pill" id="saved" hidden></span>
  <script type="module" src="newtab.js"></script>
</body>
</html>
